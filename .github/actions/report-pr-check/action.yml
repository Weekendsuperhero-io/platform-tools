# Attach a repository_dispatch / workflow_dispatch run to a PR.
# Those events never create a check suite on their own, so they only
# appear under Actions. A check run on the PR head SHA shows in Checks.

name: "Report PR check"
description: "Create a check run on a commit so a non-pull_request workflow appears on the PR"

inputs:
  name:
    description: "Check name shown in the PR Checks tab"
    required: true
  head_sha:
    description: "Commit SHA to attach the check to (PR head)"
    required: true
  conclusion:
    description: "success | failure | cancelled | skipped | timed_out | neutral"
    required: false
    default: "success"
  title:
    description: "Short check-run title"
    required: false
    default: ""
  summary:
    description: "Markdown summary. Empty uses a link to this workflow run."
    required: false
    default: ""
  token:
    description: "Token with checks: write. Defaults to github.token."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Create check run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        NAME: ${{ inputs.name }}
        SHA: ${{ inputs.head_sha }}
        CONCLUSION: ${{ inputs.conclusion }}
        TITLE: ${{ inputs.title }}
        SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        if [ -z "$SHA" ]; then
          echo "No head SHA — skipping PR check"
          exit 0
        fi
        DETAILS="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        TITLE="${TITLE:-$NAME}"
        if [ -z "$SUMMARY" ]; then
          SUMMARY="See the [workflow run](${DETAILS})."
        fi
        BODY=$(jq -n \
          --arg name "$NAME" \
          --arg sha "$SHA" \
          --arg conclusion "$CONCLUSION" \
          --arg url "$DETAILS" \
          --arg title "$TITLE" \
          --arg summary "$SUMMARY" \
          --arg id "$GITHUB_RUN_ID" \
          '{
            name: $name,
            head_sha: $sha,
            status: "completed",
            conclusion: $conclusion,
            details_url: $url,
            external_id: $id,
            output: {title: $title, summary: $summary}
          }')
        if ! printf '%s' "$BODY" | gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/tmp/check-run.json; then
          echo "::warning::Could not attach this run to the PR as a check (caller needs permissions.checks: write). It still appears under Actions: ${DETAILS}"
          cat /tmp/check-run.json 2>/dev/null || true
          exit 0
        fi
        echo "Check run posted on ${SHA}: ${DETAILS}"
