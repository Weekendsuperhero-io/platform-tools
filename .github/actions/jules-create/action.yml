# Creates a repoless Jules session from a prompt file. Does not wait.
#
# Pair with jules-collect (one GET) or jules-ai (create + poll). The prompt
# is read from a file so large diffs are not stuffed through action inputs.

name: "Jules create session"
description: "POSTs a Jules session from a prompt file and returns the session id"

inputs:
  title:
    description: "Session title (Jules metadata)"
    required: false
    default: "AI Task"
  jules_api_key:
    description: "JULES_API_KEY secret"
    required: true
  prompt_file:
    description: "Path to the prompt file generated by the calling workflow"
    required: false
    default: "/tmp/prompt.txt"

outputs:
  session_id:
    description: "Jules session id (without the sessions/ prefix)"
    value: ${{ steps.create.outputs.session_id }}
  session_url:
    description: "Jules web URL when the API returns one"
    value: ${{ steps.create.outputs.session_url }}

runs:
  using: "composite"
  steps:
    - name: Create Jules session
      id: create
      shell: bash
      env:
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        SESSION_TITLE: ${{ inputs.title }}
        PROMPT_FILE: ${{ inputs.prompt_file }}
      run: |
        set -euo pipefail

        API="https://jules.googleapis.com/v1alpha/sessions"

        if [ ! -f "$PROMPT_FILE" ]; then
          echo "::error::Prompt file not found: $PROMPT_FILE"
          exit 1
        fi

        if [ ! -s "$PROMPT_FILE" ]; then
          echo "::error::Prompt file is empty: $PROMPT_FILE"
          exit 1
        fi

        # Defensive cap: an oversized prompt is rejected with HTTP 400. Measured
        # limit is ~1.41MB of JSON payload; everything <=~1.0MB payload is
        # reliably accepted. Cap the prompt at 950KB to stay well inside that
        # (JSON escaping inflates the payload ~3%) with margin for the title.
        MAX_PROMPT_BYTES=950000
        PROMPT_BYTES=$(wc -c < "$PROMPT_FILE")
        if [ "$PROMPT_BYTES" -gt "$MAX_PROMPT_BYTES" ]; then
          echo "::warning::Prompt is ${PROMPT_BYTES} bytes; truncating to ${MAX_PROMPT_BYTES} to avoid a 400 from Jules." >&2
          head -c "$MAX_PROMPT_BYTES" "$PROMPT_FILE" > /tmp/jules_prompt_capped.txt
          printf '\n... [prompt truncated from %s bytes] ...\n' "$PROMPT_BYTES" >> /tmp/jules_prompt_capped.txt
          PROMPT_FILE=/tmp/jules_prompt_capped.txt
        fi

        # Repoless session: only the prompt is required (no sourceContext).
        jq -Rs --arg title "$SESSION_TITLE" '{prompt: ., title: $title}' "$PROMPT_FILE" > /tmp/jules_payload.json
        echo "Prompt bytes: $(wc -c < "$PROMPT_FILE"), payload bytes: $(wc -c < /tmp/jules_payload.json)" >&2

        echo "Creating Jules session..." >&2
        HTTP_CODE=$(curl -s -o /tmp/jules_session.json -w '%{http_code}' "$API" \
          -X POST \
          -H "Content-Type: application/json" \
          -H "x-goog-api-key: $JULES_API_KEY" \
          -d @/tmp/jules_payload.json)
        SESSION_RESP=$(cat /tmp/jules_session.json)

        SESSION_NAME=$(printf '%s' "$SESSION_RESP" | jq -r '.name // empty' 2>/dev/null || true)
        if [ -z "$SESSION_NAME" ]; then
          echo "::error::Failed to create Jules session (HTTP $HTTP_CODE)"
          printf '%s' "$SESSION_RESP" | jq . >&2 2>/dev/null || printf '%s\n' "$SESSION_RESP" >&2
          exit 1
        fi

        SESSION_ID=$(echo "$SESSION_NAME" | sed 's|sessions/||')
        SESSION_URL=$(printf '%s' "$SESSION_RESP" | jq -r '.url // empty' 2>/dev/null || true)
        echo "Session: $SESSION_ID" >&2

        echo "session_id=${SESSION_ID}" >> "$GITHUB_OUTPUT"
        echo "session_url=${SESSION_URL}" >> "$GITHUB_OUTPUT"
