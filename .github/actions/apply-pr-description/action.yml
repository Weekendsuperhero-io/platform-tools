# Renders the deterministic Linear section and patches the PR.
# Jules only supplies title/body/verbs; identity stays in this action.

name: "Apply PR description"
description: "Parses Jules JSON, renders ## Linear, and edits the PR"

inputs:
  jules_output:
    description: "Raw Jules agent message (JSON object, optional fences)"
    required: true
  pr_number:
    description: "Pull request number"
    required: true
  gh_token:
    description: "Token with pull-requests: write"
    required: true
  linear_candidates_file:
    description: "JSON array of {id, verb, source, title?} from the start job"
    required: false
    default: ""
  linear_human_verbs_file:
    description: "TSV of id<TAB>verb for human-edited Linear lines"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Update PR title and body
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        JULES_OUTPUT: ${{ inputs.jules_output }}
        CANDIDATES_FILE: ${{ inputs.linear_candidates_file }}
        HUMAN_VERBS_FILE: ${{ inputs.linear_human_verbs_file }}
      run: |
        set -euo pipefail

        CURRENT=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body)
        CURRENT_TITLE=$(printf '%s' "$CURRENT" | jq -r .title)
        CURRENT_BODY=$(printf '%s' "$CURRENT" | jq -r .body)

        OUTPUT=$(printf '%s' "$JULES_OUTPUT" | sed 's/^```json//;s/^```//' | tr -d '\r')

        TITLE=$(printf '%s' "$OUTPUT" | jq -r '.title // empty' 2>/dev/null || true)
        BODY=$(printf '%s' "$OUTPUT" | jq -r '.body // empty' 2>/dev/null || true)
        LLM_LINEAR=$(printf '%s' "$OUTPUT" | jq -c '.linear // []' 2>/dev/null || echo '[]')
        [ -z "$LLM_LINEAR" ] && LLM_LINEAR='[]'

        if [ -z "$TITLE" ] || [ -z "$BODY" ]; then
          echo "Jules output is not JSON — using raw output as description"
          TITLE="${CURRENT_TITLE}"
          BODY="$JULES_OUTPUT"
          LLM_LINEAR='[]'
        fi

        if [ -n "$CANDIDATES_FILE" ] && [ -s "$CANDIDATES_FILE" ] \
           && [ "$(jq 'length' "$CANDIDATES_FILE" 2>/dev/null || echo 0)" != "0" ]; then
          BODY=$(printf '%s\n' "$BODY" | awk '/^## Linear/{drop=1; next} /^## /{drop=0} !drop')

          HUMAN_JSON='[]'
          if [ -n "$HUMAN_VERBS_FILE" ] && [ -s "$HUMAN_VERBS_FILE" ]; then
            HUMAN_JSON=$(jq -R -n '[inputs | select(length>0) | split("\t") | {id: .[0], verb: .[1]}]' "$HUMAN_VERBS_FILE")
          fi

          FINAL=$(jq -n \
            --slurpfile cand "$CANDIDATES_FILE" \
            --argjson llm "$LLM_LINEAR" \
            --argjson human "$HUMAN_JSON" '
            def allowed: ["Closes","Fixes","Resolves","Completes","Part of","Refs","References","Related to"];
            [ $cand[0][] | . as $c
              | ([ $llm[]?   | select(type == "object" and .id == $c.id) ] | .[0]) as $l
              | ([ $human[]? | select(.id == $c.id) ] | .[0]) as $h
              | (if ($h.verb? // "") != "" then $h.verb
                 elif ($l.verb? // "") == "None" and $c.source != "branch" then "DROP"
                 elif (($l.verb? // "") != "") and ([$l.verb] | inside(allowed)) then $l.verb
                 else $c.verb end) as $verb
              | select($verb != "DROP")
              | {id: $c.id, verb: $verb, title: ($c.title? // "")} ]')

          if [ "$(printf '%s' "$FINAL" | jq 'length')" != "0" ]; then
            SECTION=$(printf '%s' "$FINAL" | jq -r '.[] | "\(.verb) \(.id)\(if .title != "" then " — \(.title)" else "" end)"')
            MARKER=$(printf '%s' "$FINAL" | jq -r '[.[] | "\(.id)=\(.verb)"] | join(";")')
            BODY=$(printf '## Linear\n<!-- linear-managed: %s -->\n\n%s\n\n%s' "$MARKER" "$SECTION" "$BODY")
          fi
        fi

        BODY="${BODY}

        ---
        *PR description generated by [Agent](https://weekendsuperhero.io)*"

        if [ "$TITLE" = "$CURRENT_TITLE" ] && [ "$BODY" = "$CURRENT_BODY" ]; then
          echo "Generated title/body identical to current PR — skipping update"
          exit 0
        fi

        gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
        echo "PR #${PR_NUMBER} updated successfully"
