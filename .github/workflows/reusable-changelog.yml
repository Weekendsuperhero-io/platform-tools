# Reusable workflow: changelog entries from commits via Jules — single-file
# Keep-a-Changelog mode by default, or a user-facing/internal split when
# `internal-changelog-path` is set.
#
# Docs — usage snippet, split-mode classification rules, inputs:
# docs/muse-workflows.md

name: Reusable Changelog

on:
  workflow_call:
    inputs:
      changelog-path:
        description: "Path to the user-facing CHANGELOG file"
        type: string
        required: false
        default: "CHANGELOG.md"
      internal-changelog-path:
        description: "Path to the internal changelog. Empty (default) keeps the single-file behavior; setting it enables the user-facing/internal split."
        type: string
        required: false
        default: ""
      runs-on:
        description: "Runner label for the job (e.g. warp-ubuntu-latest-x64-4x)"
        type: string
        required: false
        default: "ubuntu-latest"
      pr-branch-prefix:
        description: "Prefix for the branch created by this workflow"
        type: string
        required: false
        default: "chore/update-changelog"
      base-branch:
        description: "Branch to collect commits from and open the changelog PR against. Empty (default) uses the branch this workflow was invoked on."
        type: string
        required: false
        default: ""
      diff-file-patterns:
        description: "Space-separated glob patterns for files to include in the diff"
        type: string
        required: false
        default: "'*.rs' '*.ts' '*.tsx' '*.toml' '*.sql' '*.yml' '*.sh' '*.css'"
      diff-exclude-patterns:
        description: "Space-separated patterns to exclude from the diff"
        type: string
        required: false
        default: ":!pnpm-lock.yaml :!Cargo.lock ':!**/bindings/*.ts'"
      max-diff-lines:
        description: "Maximum lines of code diff to send to Jules"
        type: number
        required: false
        default: 4000
      max-commit-messages:
        description: "Maximum number of commit messages to include"
        type: number
        required: false
        default: 50
      fallback-commit-count:
        description: "Number of commits to use when no previous changelog entry exists"
        type: number
        required: false
        default: 20
      unreleased-heading:
        description: "The heading in the changelog that marks new entries"
        type: string
        required: false
        default: "## [Unreleased]"
      custom-prompt:
        description: "Override the default prompt (leave empty to use built-in)"
        type: string
        required: false
        default: ""
      pr-title:
        description: "Title for the generated PR"
        type: string
        required: false
        default: "docs: update CHANGELOG.md"
      pr-body-template:
        description: "Body for the generated PR (use {0} for commit count interpolation)"
        type: string
        required: false
        default: |
          Automated changelog update covering **{0} commits** since the last changelog entry.

          Generated by [Agent](https://weekendsuperhero.io) from full commit messages.
      mode:
        description: "start (workflow_dispatch) or apply (muse-changelog-ready). Empty infers start."
        type: string
        required: false
        default: ""
      session-id:
        type: string
        required: false
        default: ""
      outcome:
        type: string
        required: false
        default: ""
      start-run-id:
        type: string
        required: false
        default: ""
      max-wait-seconds:
        description: "Deadline for async watch (seconds after session create)"
        type: number
        required: false
        default: 2700
    secrets:
      JULES_API_KEY:
        required: true
      JULES_PR_CLIENT_ID:
        required: false
      JULES_PR_PRIVATE_KEY:
        required: false
      MUSE_WATCH_HMAC:
        required: false

jobs:
  changelog:
    name: Generate Changelog PR
    if: inputs.mode != 'apply'
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: write

    steps:
      - name: Validate GitHub App secret configuration
        id: app-auth-config
        shell: bash
        env:
          JULES_APP_ID: ${{ secrets.JULES_PR_CLIENT_ID }}
          JULES_APP_KEY: ${{ secrets.JULES_PR_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if { [ -n "${JULES_APP_ID}" ] && [ -z "${JULES_APP_KEY}" ]; } || { [ -z "${JULES_APP_ID}" ] && [ -n "${JULES_APP_KEY}" ]; }; then
            echo "::error::Set both JULES_PR_CLIENT_ID and JULES_PR_PRIVATE_KEY, or neither."
            exit 1
          fi

          ENABLED=false
          if [ -n "${JULES_APP_ID}" ] && [ -n "${JULES_APP_KEY}" ]; then
            ENABLED=true
          fi
          echo "enabled=${ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        if: steps.app-auth-config.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JULES_PR_CLIENT_ID }}
          private-key: ${{ secrets.JULES_PR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get GitHub App bot identity
        if: steps.app-token.outputs.token != ''
        id: app-bot
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          BOT_NAME="${APP_SLUG}[bot]"
          BOT_EMAIL="${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          echo "name=$BOT_NAME" >> "$GITHUB_OUTPUT"
          echo "email=$BOT_EMAIL" >> "$GITHUB_OUTPUT"
          echo "identity=${BOT_NAME} <${BOT_EMAIL}>" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
          ref: ${{ inputs.base-branch || github.ref }}

      - name: Ensure changelog exists
        shell: bash
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          INTERNAL_PATH: ${{ inputs.internal-changelog-path }}
          UNRELEASED: ${{ inputs.unreleased-heading }}
        run: |
          set -euo pipefail

          if [ ! -f "$CHANGELOG_PATH" ]; then
            echo "Changelog file not found. Creating $CHANGELOG_PATH"
            mkdir -p "$(dirname "$CHANGELOG_PATH")"

            cat > "$CHANGELOG_PATH" <<EOF
          # Changelog

          All notable changes to this project will be documented in this file.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

          ${UNRELEASED}
          EOF
          fi

          if [ -n "$INTERNAL_PATH" ] && [ ! -f "$INTERNAL_PATH" ]; then
            echo "Internal changelog not found. Creating $INTERNAL_PATH"
            mkdir -p "$(dirname "$INTERNAL_PATH")"

            cat > "$INTERNAL_PATH" <<EOF
          # Internal Changelog

          Mechanics and internals — refactors, CI/build, dependencies, protocol
          plumbing — recorded per release so nothing is lost. This file is NOT
          shipped to users; the user-facing changelog lives in ${CHANGELOG_PATH}.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).

          ${UNRELEASED}
          EOF
          fi

      - name: Find changes since last changelog update
        id: changes
        shell: bash
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          INTERNAL_PATH: ${{ inputs.internal-changelog-path }}
          FALLBACK_COUNT: ${{ inputs.fallback-commit-count }}
          MAX_COMMITS: ${{ inputs.max-commit-messages }}
          INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail

          BASE_BRANCH="${INPUT_BASE_BRANCH:-$GITHUB_REF_NAME}"
          BASE_SHA=$(git rev-parse HEAD)
          echo "Source branch: $BASE_BRANCH ($BASE_SHA)"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          LAST_CHANGELOG_SHA=$(git log -1 --format='%H' -- "$CHANGELOG_PATH" 2>/dev/null || true)

          if [ -z "$LAST_CHANGELOG_SHA" ]; then
            echo "No previous CHANGELOG commit found — using last $FALLBACK_COUNT commits"
            LAST_CHANGELOG_SHA=$(git log --skip="$FALLBACK_COUNT" -1 --format='%H' || true)
          fi

          RANGE_SPEC="$LAST_CHANGELOG_SHA..HEAD"
          if [ -z "$LAST_CHANGELOG_SHA" ]; then
            echo "Repository has fewer than fallback commits — scanning up to $MAX_COMMITS commits from HEAD"
            RANGE_SPEC="HEAD"
          fi

          echo "Last changelog commit: $LAST_CHANGELOG_SHA"
          echo "last_sha=$LAST_CHANGELOG_SHA" >> "$GITHUB_OUTPUT"

          EXCLUDE_PATHS=(":!$CHANGELOG_PATH")
          [ -n "$INTERNAL_PATH" ] && EXCLUDE_PATHS+=(":!$INTERNAL_PATH")

          git log -n "$MAX_COMMITS" "$RANGE_SPEC" \
            --no-merges \
            --date=iso-strict \
            --format='=== COMMIT ===%nHash: %H%nAuthor: %an <%ae>%nDate: %ad%nSubject: %s%nBody:%n%b%n' \
            -- "${EXCLUDE_PATHS[@]}" \
            > /tmp/commits.txt

          COMMIT_COUNT=$(grep -c '^=== COMMIT ===$' /tmp/commits.txt || true)
          echo "Found $COMMIT_COUNT commits since last changelog update"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build prompt
        if: steps.changes.outputs.skip != 'true'
        id: build-prompt
        shell: bash
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          INTERNAL_PATH: ${{ inputs.internal-changelog-path }}
          CUSTOM_PROMPT: ${{ inputs.custom-prompt }}
        run: |
          set -euo pipefail

          if [ -n "$CUSTOM_PROMPT" ]; then
            cat > /tmp/prompt.txt << 'EOF'
          EOF
            echo "$CUSTOM_PROMPT" >> /tmp/prompt.txt
          elif [ -n "$INTERNAL_PATH" ]; then
            # ── Split mode: one call classifies user-facing vs internal ──
            head -60 "$CHANGELOG_PATH" > /tmp/current_changelog.txt

            cat > /tmp/prompt.txt << 'HEREDOC_END'
          You are updating TWO changelogs for a desktop app, both following Keep a Changelog
          (https://keepachangelog.com/en/1.1.0/):

          1. USER-FACING — shipped verbatim to end users as release notes (GitHub Release
             body, in-app updater notes, TestFlight "What to Test"). Written for a
             non-developer user of the app.
          2. INTERNAL — an engineering record of mechanics. Never shown to users.

          Classify every change from the commits below:
          - USER-FACING: anything a user can perceive — visible behavior/UX, new
            capabilities, perceptible performance, crash/reliability fixes, security
            fixes with user impact, platform support.
          - INTERNAL: refactors with no behavior change, CI/CD and build tooling,
            dependency bumps, tests, developer docs, protocol/wire plumbing,
            schema/migration mechanics, logging/tracing, cleanup.
          - A change with BOTH a user-visible face and mechanics appears in BOTH lists
            with different wording (user words vs mechanics).
          - Unsure whether users would notice? Put it in INTERNAL — keep the user
            changelog clean. Prefer omission over a vague user-facing bullet.
          - A dependency bump that fixes a user-visible bug IS user-facing.

          Style for USER-FACING bullets:
          - `- **Feature name** — user-visible outcome.` The name is a product noun,
            never a code symbol.
          - Product voice, present tense, benefit-first. No commit-speak (bump, wip,
            refactor, plumb, wire), no ticket IDs (e.g. WEE-123), no crate/module/file
            names, no PR numbers.
          - Merge all commits about one feature into ONE bullet. Never one bullet per
            commit.

          Style for INTERNAL bullets:
          - Same `- **Name** — description.` shape, but ticket IDs, crate names, and
            technical rationale are welcome. May be more granular.

          Output a single JSON object, no markdown fences, no explanation:
          {
            "user_facing": {"Added": ["- **...** — ..."], "Changed": [], "Fixed": [], "Removed": [], "Security": [], "Deprecated": []},
            "internal":    {"Added": [], "Changed": [], "Fixed": [], "Removed": [], "Security": [], "Deprecated": []}
          }
          Every array element is one complete markdown bullet. Omit or leave empty any
          category with no entries.

          === CURRENT USER-FACING CHANGELOG FORMAT (for reference) ===
          HEREDOC_END

            cat /tmp/current_changelog.txt >> /tmp/prompt.txt
          else
            # ── Legacy single-file mode (unchanged behavior) ──
            head -60 "$CHANGELOG_PATH" > /tmp/current_changelog.txt

            cat > /tmp/prompt.txt << 'HEREDOC_END'
          You are updating a CHANGELOG.md that follows Keep a Changelog (https://keepachangelog.com/en/1.1.0/).

          Based on the full commit messages below, generate ONLY the new entries to add under ## [Unreleased].
          Group changes into the appropriate sections: ### Added, ### Changed, ### Fixed, ### Removed, ### Security.
          Only include sections that have entries. Each bullet should be bold-titled with a dash description.

          Match this format exactly (from the existing changelog):
          - **Feature name** — description of what changed and why.

          Output ONLY the markdown sections (### Added, ### Changed, etc.) with their bullets.
          No preamble. No ## [Unreleased] header. No explanation.

          === CURRENT CHANGELOG FORMAT (for reference) ===
          HEREDOC_END

            cat /tmp/current_changelog.txt >> /tmp/prompt.txt
          fi

          echo "" >> /tmp/prompt.txt
          echo "=== FULL COMMITS ===" >> /tmp/prompt.txt
          cat /tmp/commits.txt >> /tmp/prompt.txt

      - name: Detect async watch
        if: steps.changes.outputs.skip != 'true'
        id: watch
        env:
          HMAC: ${{ secrets.MUSE_WATCH_HMAC }}
          URL: ${{ vars.MUSE_WATCH_URL }}
        run: |
          if [ -n "$HMAC" ] && [ -n "$URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Jules session
        if: steps.changes.outputs.skip != 'true' && steps.watch.outputs.enabled == 'true'
        id: create
        uses: weekendsuperhero-io/platform-tools/.github/actions/jules-create@main
        with:
          title: "Changelog Update"
          jules_api_key: ${{ secrets.JULES_API_KEY }}

      - name: Register muse-watch ticket
        if: steps.changes.outputs.skip != 'true' && steps.watch.outputs.enabled == 'true'
        env:
          HMAC: ${{ secrets.MUSE_WATCH_HMAC }}
          WATCH_URL: ${{ vars.MUSE_WATCH_URL }}
          SESSION_ID: ${{ steps.create.outputs.session_id }}
          MAX_WAIT: ${{ inputs.max-wait-seconds }}
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          INTERNAL_PATH: ${{ inputs.internal-changelog-path }}
          UNRELEASED: ${{ inputs.unreleased-heading }}
          COMMIT_COUNT: ${{ steps.changes.outputs.commit_count }}
          PR_TITLE: ${{ inputs.pr-title }}
          PR_BODY: ${{ format(inputs.pr-body-template, steps.changes.outputs.commit_count) }}
          PR_BRANCH_PREFIX: ${{ inputs.pr-branch-prefix }}
          BASE_BRANCH: ${{ steps.changes.outputs.base_branch }}
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: |
          set -euo pipefail
          HMAC=$(printf '%s' "$HMAC" | tr -d '\r\n')
          mkdir -p /tmp/ticket
          cp "$CHANGELOG_PATH" "/tmp/ticket/user.md"
          if [ -n "$INTERNAL_PATH" ]; then
            cp "$INTERNAL_PATH" "/tmp/ticket/internal.md"
          fi
          jq -n \
            --arg changelog_path "$CHANGELOG_PATH" \
            --arg internal_path "$INTERNAL_PATH" \
            --arg unreleased "$UNRELEASED" \
            --arg commit_count "$COMMIT_COUNT" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_body "$PR_BODY" \
            --arg pr_branch_prefix "$PR_BRANCH_PREFIX" \
            --arg base_branch "$BASE_BRANCH" \
            --arg base_sha "$BASE_SHA" \
            '{changelog_path:$changelog_path, internal_path:$internal_path, unreleased:$unreleased, commit_count:$commit_count, pr_title:$pr_title, pr_body:$pr_body, pr_branch_prefix:$pr_branch_prefix, base_branch:$base_branch, base_sha:$base_sha}' \
            > /tmp/ticket/meta.json

          DEADLINE=$(( $(date +%s) + MAX_WAIT ))
          BODY=$(jq -n \
            --arg session_id "$SESSION_ID" \
            --arg repo "$GITHUB_REPOSITORY" \
            --argjson pr 0 \
            --argjson deadline "$DEADLINE" \
            --argjson start_run_id "$GITHUB_RUN_ID" \
            --arg event_type "muse-changelog-ready" \
            --arg base_branch "$BASE_BRANCH" \
            '{session_id:$session_id, repo:$repo, pr:$pr, deadline:$deadline, start_run_id:$start_run_id, event_type:$event_type, base_branch:$base_branch}')
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$HMAC" | awk '{print $NF}')
          HTTP=$(curl -sS -o /tmp/watch_res.txt -w '%{http_code}' -X POST "${WATCH_URL%/}/watch" \
            -H "content-type: application/json" \
            -H "x-muse-signature: ${SIG}" \
            -d "$BODY") || true
          if [ "$HTTP" != "200" ]; then
            echo "::error::muse-watch POST /watch HTTP ${HTTP}: $(cat /tmp/watch_res.txt)"
            exit 1
          fi
          echo "Registered watch for changelog session $SESSION_ID"

      - name: Upload changelog ticket
        if: steps.changes.outputs.skip != 'true' && steps.watch.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: changelog-ticket
          path: /tmp/ticket/
          retention-days: 1
          if-no-files-found: error

      - name: Generate changelog entry with Jules
        if: steps.changes.outputs.skip != 'true' && steps.watch.outputs.enabled != 'true'
        id: jules
        uses: weekendsuperhero-io/platform-tools/.github/actions/jules-ai@main
        with:
          title: "Changelog Update"
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          max_wait_seconds: ${{ inputs.max-wait-seconds }}

      - name: Patch changelog files
        if: steps.changes.outputs.skip != 'true' && steps.watch.outputs.enabled != 'true'
        uses: weekendsuperhero-io/platform-tools/.github/actions/apply-changelog-patch@main
        with:
          jules_output: ${{ steps.jules.outputs.response }}
          changelog_path: ${{ inputs.changelog-path }}
          internal_path: ${{ inputs.internal-changelog-path }}
          unreleased_heading: ${{ inputs.unreleased-heading }}

      - name: Compute PR paths
        if: steps.changes.outputs.skip != 'true' && steps.watch.outputs.enabled != 'true'
        id: paths
        shell: bash
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          INTERNAL_PATH: ${{ inputs.internal-changelog-path }}
        run: |
          {
            echo "add_paths<<PATHS_EOF"
            echo "$CHANGELOG_PATH"
            [ -n "$INTERNAL_PATH" ] && echo "$INTERNAL_PATH"
            echo "PATHS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.skip != 'true' && steps.watch.outputs.enabled != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          author: ${{ steps.app-bot.outputs.identity || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}
          committer: ${{ steps.app-bot.outputs.identity || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}
          commit-message: "docs: update CHANGELOG.md"
          title: ${{ inputs.pr-title }}
          body: ${{ format(inputs.pr-body-template, steps.changes.outputs.commit_count) }}
          branch: "${{ inputs.pr-branch-prefix }}${{ github.run_id }}"
          base: ${{ steps.changes.outputs.base_branch }}
          add-paths: ${{ steps.paths.outputs.add_paths }}

  apply:
    name: Apply changelog
    if: inputs.mode == 'apply'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate watch outcome
        env:
          OUTCOME: ${{ inputs.outcome }}
          SESSION_ID: ${{ inputs.session-id }}
        run: |
          set -euo pipefail
          if [ -z "$SESSION_ID" ]; then
            echo "::error::apply mode requires session-id"
            exit 1
          fi
          case "$OUTCOME" in
            ready) ;;
            failed)
              echo "::error::Jules changelog session failed"
              exit 1
              ;;
            timeout)
              echo "::error::Timed out waiting for Jules changelog session"
              exit 1
              ;;
            *)
              echo "::error::Unknown muse-watch outcome '${OUTCOME}'"
              exit 1
              ;;
          esac

      - name: Validate GitHub App secret configuration
        id: app-auth-config
        shell: bash
        env:
          JULES_APP_ID: ${{ secrets.JULES_PR_CLIENT_ID }}
          JULES_APP_KEY: ${{ secrets.JULES_PR_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if { [ -n "${JULES_APP_ID}" ] && [ -z "${JULES_APP_KEY}" ]; } || { [ -z "${JULES_APP_ID}" ] && [ -n "${JULES_APP_KEY}" ]; }; then
            echo "::error::Set both JULES_PR_CLIENT_ID and JULES_PR_PRIVATE_KEY, or neither."
            exit 1
          fi
          ENABLED=false
          if [ -n "${JULES_APP_ID}" ] && [ -n "${JULES_APP_KEY}" ]; then
            ENABLED=true
          fi
          echo "enabled=${ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        if: steps.app-auth-config.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JULES_PR_CLIENT_ID }}
          private-key: ${{ secrets.JULES_PR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get GitHub App bot identity
        if: steps.app-token.outputs.token != ''
        id: app-bot
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          BOT_NAME="${APP_SLUG}[bot]"
          BOT_EMAIL="${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          echo "name=$BOT_NAME" >> "$GITHUB_OUTPUT"
          echo "email=$BOT_EMAIL" >> "$GITHUB_OUTPUT"
          echo "identity=${BOT_NAME} <${BOT_EMAIL}>" >> "$GITHUB_OUTPUT"

      - name: Download changelog ticket
        env:
          GH_TOKEN: ${{ github.token }}
          START_RUN_ID: ${{ inputs.start-run-id }}
        run: |
          set -euo pipefail
          gh run download "$START_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name changelog-ticket \
            --dir /tmp/ticket

      - name: Read changelog ticket
        id: ticket
        env:
          INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BASE_BRANCH=$(jq -r '.base_branch // empty' /tmp/ticket/meta.json)
          BASE_SHA=$(jq -r '.base_sha // empty' /tmp/ticket/meta.json)
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="$INPUT_BASE_BRANCH"
          fi
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="$DEFAULT_BRANCH"
            echo "::warning::Ticket missing base_branch; falling back to default branch ${BASE_BRANCH}"
          fi
          REF="${BASE_SHA:-$BASE_BRANCH}"
          echo "Changelog PR will target ${BASE_BRANCH} (checkout ${REF})"
          echo "base_branch=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
          ref: ${{ steps.ticket.outputs.ref }}

      - name: Restore changelog files from start
        run: |
          set -euo pipefail
          CHANGELOG_PATH=$(jq -r .changelog_path /tmp/ticket/meta.json)
          INTERNAL_PATH=$(jq -r .internal_path /tmp/ticket/meta.json)
          mkdir -p "$(dirname "$CHANGELOG_PATH")"
          cp /tmp/ticket/user.md "$CHANGELOG_PATH"
          if [ -n "$INTERNAL_PATH" ] && [ "$INTERNAL_PATH" != "null" ] && [ -f /tmp/ticket/internal.md ]; then
            mkdir -p "$(dirname "$INTERNAL_PATH")"
            cp /tmp/ticket/internal.md "$INTERNAL_PATH"
          fi

      - name: Collect Jules response
        id: collect
        uses: weekendsuperhero-io/platform-tools/.github/actions/jules-collect@main
        with:
          session_id: ${{ inputs.session-id }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}

      - name: Require a ready session
        if: steps.collect.outputs.status != 'ready'
        run: |
          echo "::error::Jules session ${{ inputs.session-id }} was ${{ steps.collect.outputs.status }} at apply time"
          exit 1

      - name: Patch changelog files
        uses: weekendsuperhero-io/platform-tools/.github/actions/apply-changelog-patch@main
        with:
          jules_output: ${{ steps.collect.outputs.response }}
          changelog_path: ${{ inputs.changelog-path }}
          internal_path: ${{ inputs.internal-changelog-path }}
          unreleased_heading: ${{ inputs.unreleased-heading }}

      - name: Compute PR paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          CHANGELOG_PATH=$(jq -r .changelog_path /tmp/ticket/meta.json)
          INTERNAL_PATH=$(jq -r '.internal_path // empty' /tmp/ticket/meta.json)
          {
            echo "add_paths<<PATHS_EOF"
            echo "$CHANGELOG_PATH"
            [ -n "$INTERNAL_PATH" ] && [ "$INTERNAL_PATH" != "null" ] && echo "$INTERNAL_PATH"
            echo "PATHS_EOF"
            echo "title=$(jq -r .pr_title /tmp/ticket/meta.json)"
            echo "prefix=$(jq -r .pr_branch_prefix /tmp/ticket/meta.json)"
            echo "body<<BODY_EOF"
            jq -r .pr_body /tmp/ticket/meta.json
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          author: ${{ steps.app-bot.outputs.identity || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}
          committer: ${{ steps.app-bot.outputs.identity || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}
          commit-message: "docs: update CHANGELOG.md"
          title: ${{ steps.paths.outputs.title }}
          body: ${{ steps.paths.outputs.body }}
          branch: "${{ steps.paths.outputs.prefix }}${{ inputs.start-run-id }}"
          base: ${{ steps.ticket.outputs.base_branch }}
          add-paths: ${{ steps.paths.outputs.add_paths }}
