name: Shared workflow tools

on:
  pull_request:
    paths:
      - "ci/**"
      - "scripts/sync-workflows.py"
      - ".github/workflows/shared-workflows.yml"
  push:
    branches: [main]
    paths:
      - "ci/**"
      - "scripts/sync-workflows.py"
      - ".github/workflows/shared-workflows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Restore workflow tools
        uses: actions/cache@v4
        with:
          path: .cache/workflow-tools
          key: ${{ runner.os }}-${{ runner.arch }}-workflow-tools-${{ hashFiles('ci/workflows/tools.json') }}

      - name: Test discovery and snapshot refresh
        run: python3 -m unittest discover -s ci/tests -v

      - name: Check Pkl generation and workflow lint
        run: python3 ci/tests/smoke_workflows.py
