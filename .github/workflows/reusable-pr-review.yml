# Reusable workflow: label-gated PR review loop with three Muse review agents
# (code review · security · test coverage), powered by Jules.
#
# Docs — loop mechanics, delta rounds, label taxonomy, lenses, inputs, and a
# copy-paste caller (whose exact-match label guard + job-level concurrency
# are load-bearing): docs/muse-workflows.md

name: Reusable PR Review

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label for all jobs (e.g. warp-ubuntu-latest-x64-4x)"
        type: string
        required: false
        default: "ubuntu-latest"
      agents:
        description: "Comma-separated agents to run: any of review,security,tests"
        type: string
        required: false
        default: "review,security,tests"
      trigger-label:
        description: "Label that starts a review round (removed on pickup so it re-arms)"
        type: string
        required: false
        default: "muse:review"
      force-label:
        description: "Label that starts a round even when the head SHA was already reviewed"
        type: string
        required: false
        default: "muse:force"
      review-guidelines:
        description: "Comma-separated repo paths appended to the code-review agent's prompt (e.g. RULES.md)"
        type: string
        required: false
        default: ""
      security-guidelines:
        description: "Comma-separated repo paths appended to the security agent's prompt"
        type: string
        required: false
        default: ""
      tests-guidelines:
        description: "Comma-separated repo paths appended to the test-coverage agent's prompt"
        type: string
        required: false
        default: ""
      diff-file-patterns:
        description: "Space-separated glob patterns for files to include in the diff"
        type: string
        required: false
        default: "'*.rs' '*.ts' '*.tsx' '*.toml' '*.sql' '*.yml' '*.sh' '*.css' '*.go' '*.swift'"
      diff-exclude-patterns:
        description: "Space-separated patterns to exclude from the diff"
        type: string
        required: false
        default: ":!pnpm-lock.yaml :!Cargo.lock ':!**/bindings/*.ts'"
      max-commit-messages:
        description: "Maximum number of commit messages to include"
        type: number
        required: false
        default: 30
      max-findings:
        description: "Cap on NEW findings per agent per round"
        type: number
        required: false
        default: 12
      max-wait-seconds:
        description: "Maximum seconds to wait for each Jules session"
        type: number
        required: false
        default: 2700
      mode:
        description: "start (labeled/synchronize) or apply (muse-pr-review-ready). Empty infers start."
        type: string
        required: false
        default: ""
      session-id:
        type: string
        required: false
        default: ""
      pr-number:
        type: number
        required: false
        default: 0
      outcome:
        type: string
        required: false
        default: ""
      start-run-id:
        type: string
        required: false
        default: ""
      agent:
        description: "Which agent to apply (review | security | tests)"
        type: string
        required: false
        default: ""
    secrets:
      JULES_API_KEY:
        required: true
      JULES_PR_CLIENT_ID:
        required: false
      JULES_PR_PRIVATE_KEY:
        required: false
      MUSE_WATCH_HMAC:
        required: false

jobs:
  # ── New commits invalidate the last round: strip stale outcome labels. ──
  # (The caller's concurrency group has already cancelled any in-flight
  # round for this PR.) Sticky comments stay — they self-update next round.
  cleanup:
    name: Clear stale review labels
    if: inputs.mode != 'apply' && github.event.action == 'synchronize'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove outcome labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for label in "muse:reviewing" "muse:approved" "muse:error" \
                       "review:approved" "review:needs-changes" \
                       "security:clear" "security:flagged" \
                       "tests:sufficient" "tests:needs-work"; do
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$label" 2>/dev/null || true
          done
          echo "Stale review labels cleared for PR #$PR (new commits)"

  # ── Gate + shared context. Runs once per round; agents fan out from it. ──
  prepare:
    name: Prepare review round
    if: >-
      inputs.mode != 'apply'
      && github.event.action == 'labeled'
      && (github.event.label.name == inputs.trigger-label
          || github.event.label.name == inputs.force-label)
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      skip: ${{ steps.state.outputs.skip }}
      agents: ${{ steps.state.outputs.agents }}
      watch_enabled: ${{ steps.watch.outputs.enabled }}
      skipped: ${{ steps.state.outputs.skipped }}
      round: ${{ steps.state.outputs.round }}
    steps:
      - name: Detect async watch
        id: watch
        env:
          HMAC: ${{ secrets.MUSE_WATCH_HMAC }}
          URL: ${{ vars.MUSE_WATCH_URL }}
        run: |
          if [ -n "$HMAC" ] && [ -n "$URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate GitHub App secret configuration
        id: app-auth-config
        shell: bash
        env:
          JULES_APP_ID: ${{ secrets.JULES_PR_CLIENT_ID }}
          JULES_APP_KEY: ${{ secrets.JULES_PR_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if { [ -n "${JULES_APP_ID}" ] && [ -z "${JULES_APP_KEY}" ]; } || { [ -z "${JULES_APP_ID}" ] && [ -n "${JULES_APP_KEY}" ]; }; then
            echo "::error::Set both JULES_PR_CLIENT_ID and JULES_PR_PRIVATE_KEY, or neither."
            exit 1
          fi
          ENABLED=false
          if [ -n "${JULES_APP_ID}" ] && [ -n "${JULES_APP_KEY}" ]; then
            ENABLED=true
          fi
          echo "enabled=${ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        if: steps.app-auth-config.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JULES_PR_CLIENT_ID }}
          private-key: ${{ secrets.JULES_PR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Remove the pressed label FIRST so the button re-arms even when this
      # round later skips or fails, then make sure the whole taxonomy exists
      # (idempotent — `--force` updates color/description in place).
      - name: Re-arm trigger and bootstrap labels
        env:
          # github.token, never the app token: default-token events don't
          # trigger workflows, so our own label writes can't spawn a newer
          # (skipped) run that shadows this round in the PR checks view.
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PRESSED: ${{ github.event.label.name }}
        run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$PRESSED" 2>/dev/null || true

          create() { gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3" --force >/dev/null 2>&1 || true; }
          create "muse:review"          "ededed" "Request a Muse review round (re-add to re-run)"
          create "muse:force"           "ededed" "Force a Muse round even if this SHA was already reviewed"
          create "muse:reviewing"       "fbca04" "Muse review round in progress"
          create "muse:approved"        "0e8a16" "All Muse review agents positive"
          create "muse:error"           "b60205" "A Muse review agent failed — see workflow run"
          create "review:approved"       "0e8a16" "Muse code review: no blocking findings"
          create "review:needs-changes"  "d93f0b" "Muse code review: blocking findings open"
          create "security:clear"        "0e8a16" "Muse security review: no blocking findings"
          create "security:flagged"      "b60205" "Muse security review: blocking findings open"
          create "tests:sufficient"      "0e8a16" "Muse test review: coverage adequate for this diff"
          create "tests:needs-work"      "d93f0b" "Muse test review: missing tests for this diff"
          echo "Trigger re-armed; label taxonomy ensured"

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0

      # Each agent's sticky comment carries `<!-- muse:<agent> sha:… round:N -->`
      # plus a base64 state block of its open findings. Read them to decide
      # same-SHA skip and to seed the delta round.
      - name: Read previous round state
        id: state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENTS: ${{ inputs.agents }}
          FORCED: ${{ github.event.label.name == inputs.force-label }}
        run: |
          set -euo pipefail
          mkdir -p context

          # Validate + normalize the agent list.
          AGENTS_JSON=$(printf '%s' "$AGENTS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          for a in $(printf '%s' "$AGENTS_JSON" | jq -r '.[]'); do
            case "$a" in review|security|tests) ;; *)
              echo "::error::Unknown agent '$a' (allowed: review, security, tests)"; exit 1 ;;
            esac
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[]' | jq -s '.' > /tmp/all_comments.json
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --paginate --jq '.[].name' > /tmp/pr_labels.txt || : > /tmp/pr_labels.txt
          has_label() { grep -qxF "$1" /tmp/pr_labels.txt; }

          # Per-agent skip: an agent that already reviewed THIS head SHA and
          # whose positive label still stands doesn't burn another session —
          # its verdict is read from the labels. Agents that failed (or never
          # ran) at this SHA DO re-run on a press, so a press doubles as a
          # re-roll of open verdicts. The force label re-runs everyone, and
          # removing an agent's positive label by hand forces just that one.
          RUN_AGENTS='[]'
          SKIPPED_AGENTS='[]'
          MAX_ROUND=0
          LAST_SHA=""
          for a in $(printf '%s' "$AGENTS_JSON" | jq -r '.[]'); do
            case "$a" in
              review)   POS="review:approved" ;;
              security) POS="security:clear" ;;
              tests)    POS="tests:sufficient" ;;
            esac

            BODY=$(jq -r --arg m "<!-- muse:${a} sha:" '[.[] | select(.body | contains($m))] | last | .body // empty' /tmp/all_comments.json)
            SHA=$(printf '%s' "$BODY" | grep -oE "<!-- muse:${a} sha:[0-9a-f]+" | grep -oE '[0-9a-f]{7,}' | head -1 || true)
            ROUND=$(printf '%s' "$BODY" | grep -oE "round:[0-9]+" | head -1 | cut -d: -f2 || true)
            STATE=$(printf '%s' "$BODY" | grep -oE "<!-- muse:${a}:state [A-Za-z0-9+/=]+" | awk '{print $3}' || true)

            if [ -n "$STATE" ] && printf '%s' "$STATE" | base64 -d 2>/dev/null | jq -e 'type == "array"' > /dev/null 2>&1; then
              printf '%s' "$STATE" | base64 -d > "context/prev_${a}.json"
            else
              echo '[]' > "context/prev_${a}.json"
            fi

            [ -n "$SHA" ] && LAST_SHA="$SHA"
            [ -n "${ROUND:-}" ] && [ "$ROUND" -gt "$MAX_ROUND" ] && MAX_ROUND=$ROUND

            if [ "$FORCED" != "true" ] && [ "$SHA" = "$HEAD_SHA" ] && has_label "$POS"; then
              SKIPPED_AGENTS=$(printf '%s' "$SKIPPED_AGENTS" | jq -c --arg a "$a" '. + [$a]')
              echo "  $a: already positive at ${SHA:0:7} ($POS stands) — skipping"
            else
              RUN_AGENTS=$(printf '%s' "$RUN_AGENTS" | jq -c --arg a "$a" '. + [$a]')
              echo "  $a: run (last sha=${SHA:-none} round=${ROUND:-0} open=$(jq 'length' "context/prev_${a}.json"))"
            fi
          done

          if [ "$(printf '%s' "$RUN_AGENTS" | jq 'length')" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Every requested agent is already positive at $HEAD_SHA — nothing to run. Use the force label to re-review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "agents=$(printf '%s' "$RUN_AGENTS" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "skipped=$(printf '%s' "$SKIPPED_AGENTS" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "round=$((MAX_ROUND + 1))" >> "$GITHUB_OUTPUT"
          echo "last_sha=$LAST_SHA" >> "$GITHUB_OUTPUT"

      - name: Mark round in progress
        if: steps.state.outputs.skip != 'true'
        env:
          # github.token, never the app token — see "Re-arm trigger" above.
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "muse:reviewing"

      - name: Gather shared context
        if: steps.state.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAST_SHA: ${{ steps.state.outputs.last_sha }}
          ROUND: ${{ steps.state.outputs.round }}
          PATTERNS: ${{ inputs.diff-file-patterns }}
          EXCLUDES: ${{ inputs.diff-exclude-patterns }}
          MAX_COMMITS: ${{ inputs.max-commit-messages }}
          REVIEW_GUIDELINES: ${{ inputs.review-guidelines }}
          SECURITY_GUIDELINES: ${{ inputs.security-guidelines }}
          TESTS_GUIDELINES: ${{ inputs.tests-guidelines }}
          AGENTS_JSON: ${{ steps.state.outputs.agents }}
          SKIPPED_JSON: ${{ steps.state.outputs.skipped }}
        run: |
          set -euo pipefail

          git log -n "$MAX_COMMITS" \
            --format="commit %h%n%B%n=== END OF COMMIT ===%n" \
            "${BASE_SHA}"..HEAD > context/commits.txt

          git diff --name-status "${BASE_SHA}"...HEAD > context/files.txt

          # Same include/exclude + per-file-collapse strategy as the
          # PR-description workflow: full context for normal files, one huge
          # generated file can't crowd out the rest.
          PATTERNS_CLEAN=${PATTERNS//\'/}
          EXCLUDES_CLEAN=${EXCLUDES//\'/}
          # shellcheck disable=SC2206
          PATTERNS_ARRAY=($PATTERNS_CLEAN)
          # shellcheck disable=SC2206
          EXCLUDES_ARRAY=($EXCLUDES_CLEAN)
          DEFAULT_EXCLUDES=(
            ':(exclude)*.lock'
            ':(exclude)*package-lock.json'
            ':(exclude)*pnpm-lock.yaml'
            ':(exclude)*.min.js'
            ':(exclude)*.min.css'
            ':(exclude)*.map'
            ':(exclude)*.snap'
            ':(exclude)*__snapshots__*'
          )

          MAX_FILE_DIFF_BYTES=60000
          MAX_DELTA_BYTES=200000
          : > context/diff.txt
          git -c core.quotePath=false diff --name-only "${BASE_SHA}"...HEAD -- \
            "${PATTERNS_ARRAY[@]}" "${EXCLUDES_ARRAY[@]}" "${DEFAULT_EXCLUDES[@]}" \
            > /tmp/changed_files.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git -c core.quotePath=false diff -U3 "${BASE_SHA}"...HEAD -- "$f" > /tmp/file_diff.txt
            fbytes=$(wc -c < /tmp/file_diff.txt)
            if [ "$fbytes" -gt "$MAX_FILE_DIFF_BYTES" ]; then
              # No `git … | sed`: an early-exiting reader can SIGPIPE git,
              # which pipefail turns into a failed step. Trim in the shell.
              stat_line=$(git diff --stat "${BASE_SHA}"...HEAD -- "$f")
              stat_line=${stat_line%%$'\n'*}
              printf '%s\n... [diff for this file collapsed: %s bytes; see stat] ...\n\n' \
                "$stat_line" "$fbytes" >> context/diff.txt
            else
              cat /tmp/file_diff.txt >> context/diff.txt
            fi
          done < /tmp/changed_files.txt

          # Delta diff for follow-up rounds (falls back to full when the last
          # reviewed SHA is gone, e.g. after a force-push).
          DELTA=false
          if [ -n "$LAST_SHA" ] && git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
            # Cap via a file, never `git … | head`: head exits at the cap, git
            # dies on SIGPIPE, and pipefail fails the step with 141 — exactly
            # when the delta is big enough to need capping.
            git -c core.quotePath=false diff -U3 "${LAST_SHA}"...HEAD -- \
              "${PATTERNS_ARRAY[@]}" "${EXCLUDES_ARRAY[@]}" "${DEFAULT_EXCLUDES[@]}" \
              > /tmp/delta_full.txt
            head -c "$MAX_DELTA_BYTES" /tmp/delta_full.txt > context/delta_diff.txt
            dbytes=$(wc -c < /tmp/delta_full.txt)
            if [ "$dbytes" -gt "$MAX_DELTA_BYTES" ]; then
              printf '\n... [delta diff truncated at %s of %s bytes; see the full diff] ...\n' \
                "$MAX_DELTA_BYTES" "$dbytes" >> context/delta_diff.txt
            fi
            DELTA=true
          else
            : > context/delta_diff.txt
          fi

          # Human discussion (agents see pushback/decisions); our own sticky
          # comments are excluded.
          jq -r '[.[] | select(.body | contains("<!-- muse:") | not)] | .[-15:] | .[] |
                 "@\(.user.login) (\(.created_at)):\n\(.body[0:1500])\n---"' \
            /tmp/all_comments.json > context/comments.txt || : > context/comments.txt

          # Per-agent guidelines: concatenate the caller-listed repo files.
          write_guidelines() {
            local out="$1" list="$2" budget=30000
            : > "$out"
            [ -z "$list" ] && return 0
            IFS=',' read -ra paths <<< "$list"
            for p in "${paths[@]}"; do
              p=$(printf '%s' "$p" | sed -E 's/^ +| +$//g')
              [ -f "$p" ] || { echo "::warning::Guidelines file not found: $p"; continue; }
              {
                printf '\n===== %s =====\n' "$p"
                head -c "$budget" "$p"
              } >> "$out"
            done
          }
          write_guidelines context/guidelines_review.md   "$REVIEW_GUIDELINES"
          write_guidelines context/guidelines_security.md "$SECURITY_GUIDELINES"
          write_guidelines context/guidelines_tests.md    "$TESTS_GUIDELINES"

          jq -n --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg last "$LAST_SHA" \
                --argjson round "$ROUND" --argjson delta "$DELTA" \
                --argjson agents "${AGENTS_JSON:-[]}" \
                --argjson skipped "${SKIPPED_JSON:-[]}" \
                '{head_sha: $head, base_sha: $base, last_sha: $last, round: $round, delta: $delta, agents: $agents, skipped: $skipped}' \
            > context/meta.json

          echo "Context ready: diff $(wc -c < context/diff.txt)B, delta $(wc -c < context/delta_diff.txt)B, round $ROUND"

      - name: Upload context artifact
        if: steps.state.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-review-context
          path: context/
          retention-days: 1
          if-no-files-found: error

  # ── One Jules session per agent, in parallel. ──────────────────────────
  agent:
    name: Muse ${{ matrix.agent }}
    needs: prepare
    if: inputs.mode != 'apply' && needs.prepare.outputs.skip != 'true'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.prepare.outputs.agents) }}
    steps:
      - name: Download context
        uses: actions/download-artifact@v8
        with:
          name: pr-review-context
          path: context/

      # The prompts are markdown templates shipped by the muse-prompts
      # composite action (referencing a remote action is what downloads the
      # platform-tools tarball — reusable workflows never check out their own
      # repo). Edit .github/actions/muse-prompts/prompts/*.md to tune the
      # reviewers.
      - name: Fetch prompt templates
        id: prompts
        uses: weekendsuperhero-io/platform-tools/.github/actions/muse-prompts@main

      - name: Build prompt
        env:
          AGENT: ${{ matrix.agent }}
          MAX_FINDINGS: ${{ inputs.max-findings }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PROMPTS_DIR: ${{ steps.prompts.outputs.dir }}
        run: |
          set -euo pipefail
          ROUND=$(jq -r '.round' context/meta.json)
          DELTA=$(jq -r '.delta' context/meta.json)
          LAST_SHA=$(jq -r '.last_sha' context/meta.json)
          PREV_COUNT=$(jq 'length' "context/prev_${AGENT}.json")

          case "$AGENT" in
            review)   PREFIX="REV" ;;
            security) PREFIX="SEC" ;;
            tests)    PREFIX="TST" ;;
          esac

          # Substitute {{TOKENS}} in a template (all values are alphanumeric).
          render() {
            sed -e "s/{{AGENT}}/${AGENT}/g" \
                -e "s/{{PREFIX}}/${PREFIX}/g" \
                -e "s/{{ROUND}}/${ROUND}/g" \
                -e "s/{{MAX_FINDINGS}}/${MAX_FINDINGS}/g" "$1"
          }

          render "${PROMPTS_DIR}/contract.md" > /tmp/prompt.txt

          {
            echo ""
            render "${PROMPTS_DIR}/${AGENT}.md"
            echo ""
            echo "=== PR TITLE ==="
            echo "$PR_TITLE"

            if [ -s "context/guidelines_${AGENT}.md" ]; then
              echo ""
              echo "=== PROJECT GUIDELINES ==="
              cat "context/guidelines_${AGENT}.md"
            fi

            if [ "$PREV_COUNT" -gt 0 ]; then
              echo ""
              echo "=== PREVIOUS FINDINGS (round $((ROUND - 1)), still open) ==="
              jq . "context/prev_${AGENT}.json"
            fi

            echo ""
            echo "=== COMMITS ==="
            cat context/commits.txt
            echo ""
            echo "=== FILES CHANGED ==="
            cat context/files.txt

            if [ -s context/comments.txt ]; then
              echo ""
              echo "=== RECENT PR DISCUSSION (humans) ==="
              cat context/comments.txt
            fi

            MAX_DIFF_BYTES=600000
            echo ""
            if [ "$(wc -c < context/diff.txt)" -gt "$MAX_DIFF_BYTES" ]; then
              echo "=== FULL DIFF (truncated to ${MAX_DIFF_BYTES} bytes) ==="
              head -c "$MAX_DIFF_BYTES" context/diff.txt
            else
              echo "=== FULL DIFF ==="
              cat context/diff.txt
            fi

            if [ "$DELTA" = "true" ] && [ -s context/delta_diff.txt ]; then
              echo ""
              echo "=== CHANGES SINCE LAST REVIEW (${LAST_SHA}) ==="
              cat context/delta_diff.txt
            fi
          } >> /tmp/prompt.txt

          echo "Prompt: $(wc -c < /tmp/prompt.txt) bytes"

      - name: Create Jules session
        if: needs.prepare.outputs.watch_enabled == 'true'
        id: create
        uses: weekendsuperhero-io/platform-tools/.github/actions/jules-create@main
        with:
          title: "PR Review (${{ matrix.agent }})"
          jules_api_key: ${{ secrets.JULES_API_KEY }}

      - name: Register muse-watch ticket
        if: needs.prepare.outputs.watch_enabled == 'true'
        env:
          HMAC: ${{ secrets.MUSE_WATCH_HMAC }}
          WATCH_URL: ${{ vars.MUSE_WATCH_URL }}
          SESSION_ID: ${{ steps.create.outputs.session_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_WAIT: ${{ inputs.max-wait-seconds }}
          AGENT: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          HMAC=$(printf '%s' "$HMAC" | tr -d '\r\n')
          DEADLINE=$(( $(date +%s) + MAX_WAIT ))
          BODY=$(jq -n \
            --arg session_id "$SESSION_ID" \
            --arg repo "$GITHUB_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --argjson deadline "$DEADLINE" \
            --argjson start_run_id "$GITHUB_RUN_ID" \
            --arg event_type "muse-pr-review-ready" \
            --arg agent "$AGENT" \
            '{session_id:$session_id, repo:$repo, pr:$pr, deadline:$deadline, start_run_id:$start_run_id, event_type:$event_type, agent:$agent}')
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$HMAC" | awk '{print $NF}')
          HTTP=$(curl -sS -o /tmp/watch_res.txt -w '%{http_code}' -X POST "${WATCH_URL%/}/watch" \
            -H "content-type: application/json" \
            -H "x-muse-signature: ${SIG}" \
            -d "$BODY") || true
          if [ "$HTTP" != "200" ]; then
            echo "::error::muse-watch POST /watch HTTP ${HTTP}: $(cat /tmp/watch_res.txt)"
            exit 1
          fi
          echo "Registered watch for ${AGENT} session $SESSION_ID"

      - name: Run Muse ${{ matrix.agent }} agent
        if: needs.prepare.outputs.watch_enabled != 'true'
        id: jules
        uses: weekendsuperhero-io/platform-tools/.github/actions/jules-ai@main
        with:
          title: "PR Review (${{ matrix.agent }})"
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          max_wait_seconds: ${{ inputs.max-wait-seconds }}

      - name: Parse response and update sticky comment
        if: needs.prepare.outputs.watch_enabled != 'true'
        uses: weekendsuperhero-io/platform-tools/.github/actions/apply-pr-review-agent@main
        with:
          agent: ${{ matrix.agent }}
          pr_number: ${{ github.event.pull_request.number }}
          jules_output: ${{ steps.jules.outputs.response }}
          context_dir: context
          gh_token: ${{ github.token }}

      - name: Upload verdict
        if: needs.prepare.outputs.watch_enabled != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verdict-${{ matrix.agent }}
          path: verdict/
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply Muse ${{ inputs.agent }}
    if: inputs.mode == 'apply'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Validate watch outcome
        id: gate
        env:
          OUTCOME: ${{ inputs.outcome }}
          SESSION_ID: ${{ inputs.session-id }}
          PR_NUMBER: ${{ inputs.pr-number }}
          AGENT: ${{ inputs.agent }}
        run: |
          set -euo pipefail
          if [ -z "$SESSION_ID" ] || [ "$PR_NUMBER" = "0" ] || [ -z "$AGENT" ]; then
            echo "::error::apply mode requires session-id, pr-number, and agent"
            exit 1
          fi
          case "$OUTCOME" in
            ready) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            failed|timeout)
              echo "::warning::Jules ${AGENT} session ${SESSION_ID} ${OUTCOME}"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown muse-watch outcome '${OUTCOME}'"
              exit 1
              ;;
          esac

      - name: Download review context
        env:
          GH_TOKEN: ${{ github.token }}
          START_RUN_ID: ${{ inputs.start-run-id }}
        run: |
          set -euo pipefail
          gh run download "$START_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pr-review-context \
            --dir context

      - name: Collect Jules response
        if: steps.gate.outputs.ready == 'true'
        id: collect
        uses: weekendsuperhero-io/platform-tools/.github/actions/jules-collect@main
        with:
          session_id: ${{ inputs.session-id }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}

      - name: Require a ready session
        if: steps.gate.outputs.ready == 'true' && steps.collect.outputs.status != 'ready'
        run: |
          echo "::error::Jules session ${{ inputs.session-id }} was ${{ steps.collect.outputs.status }} at apply time"
          exit 1

      - name: Parse response and update sticky comment
        if: steps.gate.outputs.ready == 'true'
        uses: weekendsuperhero-io/platform-tools/.github/actions/apply-pr-review-agent@main
        with:
          agent: ${{ inputs.agent }}
          pr_number: ${{ inputs.pr-number }}
          jules_output: ${{ steps.collect.outputs.response }}
          context_dir: context
          gh_token: ${{ github.token }}

      - name: Mark this agent failed
        if: steps.gate.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr-number }}
          AGENT: ${{ inputs.agent }}
        run: |
          set -euo pipefail
          case "$AGENT" in
            review)   NEG="review:needs-changes"; POS="review:approved" ;;
            security) NEG="security:flagged"; POS="security:clear" ;;
            tests)    NEG="tests:needs-work"; POS="tests:sufficient" ;;
          esac
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "$NEG" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$POS" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "muse:error" 2>/dev/null || true

      - name: Roll up labels if the round is complete
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          AGENTS=$(jq -c '.agents // []' context/meta.json)
          SKIPPED=$(jq -c '.skipped // []' context/meta.json)
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --paginate --jq '.[].name' > /tmp/pr_labels.txt || : > /tmp/pr_labels.txt
          has() { grep -qxF "$1" /tmp/pr_labels.txt; }

          ERROR=false
          ALL_POSITIVE=true
          PENDING=false

          for a in $(printf '%s' "$SKIPPED" | jq -r '.[]?'); do
            echo "${a}: skipped (already positive)"
          done

          for a in $(printf '%s' "$AGENTS" | jq -r '.[]'); do
            case "$a" in
              review)   POS="review:approved";  NEG="review:needs-changes" ;;
              security) POS="security:clear";   NEG="security:flagged" ;;
              tests)    POS="tests:sufficient"; NEG="tests:needs-work" ;;
              *)        continue ;;
            esac
            if has "$NEG"; then
              echo "${a}: fail"
              ALL_POSITIVE=false
            elif has "$POS"; then
              echo "${a}: pass"
            else
              echo "${a}: still pending"
              PENDING=true
            fi
          done

          if [ "$PENDING" = "true" ]; then
            echo "Round still in progress"
            exit 0
          fi

          add()    { gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "$1" 2>/dev/null || true; }
          remove() { gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$1" 2>/dev/null || true; }
          if [ "$ERROR" = "true" ]; then add "muse:error"; else remove "muse:error"; fi
          if [ "$ALL_POSITIVE" = "true" ]; then add "muse:approved"; else remove "muse:approved"; fi
          remove "muse:reviewing"
          echo "Round complete"

      - name: Fail on Jules error
        if: steps.gate.outputs.ready != 'true'
        run: exit 1

  # ── Map verdicts to labels; flag agent failures. ────────────────────────
  finalize:
    name: Apply review outcome
    needs: [prepare, agent]
    if: >-
      always()
      && inputs.mode != 'apply'
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.skip != 'true'
      && needs.prepare.outputs.watch_enabled != 'true'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Download verdicts
        uses: actions/download-artifact@v8
        with:
          pattern: verdict-*
          path: verdicts/
          merge-multiple: true
        continue-on-error: true

      - name: Set outcome labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AGENTS_JSON: ${{ needs.prepare.outputs.agents }}
          SKIPPED_JSON: ${{ needs.prepare.outputs.skipped }}
        run: |
          set -euo pipefail
          add()    { gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "$1" 2>/dev/null || true; }
          remove() { gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$1" 2>/dev/null || true; }

          ERROR=false
          ALL_POSITIVE=true

          # Agents skipped by prepare were skipped BECAUSE their positive
          # label stands at this SHA — they count as positive and their
          # labels are left untouched.
          for a in $(printf '%s' "${SKIPPED_JSON:-[]}" | jq -r '.[]?'); do
            echo "${a}: skipped (already positive at this SHA)"
          done

          for a in $(printf '%s' "$AGENTS_JSON" | jq -r '.[]'); do
            case "$a" in
              review)   POS="review:approved";  NEG="review:needs-changes" ;;
              security) POS="security:clear";   NEG="security:flagged" ;;
              tests)    POS="tests:sufficient"; NEG="tests:needs-work" ;;
              *)        continue ;;
            esac

            F="verdicts/verdict-${a}.json"
            if [ ! -f "$F" ]; then
              echo "::warning::No verdict from the Muse ${a} agent (job failed?)"
              ERROR=true; ALL_POSITIVE=false
              remove "$POS"; remove "$NEG"
              continue
            fi

            V=$(jq -r '.verdict' "$F")
            echo "${a}: ${V} ($(jq -r '.open' "$F") open)"
            if [ "$V" = "fail" ]; then
              add "$NEG"; remove "$POS"; ALL_POSITIVE=false
            else
              add "$POS"; remove "$NEG"
            fi
          done

          if [ "$ERROR" = "true" ]; then add "muse:error"; else remove "muse:error"; fi
          if [ "$ALL_POSITIVE" = "true" ]; then add "muse:approved"; else remove "muse:approved"; fi
          remove "muse:reviewing"
          echo "Round complete"
